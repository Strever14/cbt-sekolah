<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Selesai</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scale-in {
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-indigo-50/30 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <main class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 sm:p-10 text-center animate-fade-in-up">
        
        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 ring-8 ring-emerald-50/50 animate-scale-in">
            <i class="fa-solid fa-check text-4xl"></i>
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
            Ujian Berhasil Diselesaikan
        </h1>
        
        <p class="text-slate-500 text-sm sm:text-base mt-3 leading-relaxed">
            Jawaban Anda telah aman tersimpan di dalam sistem. Silakan klik tombol di bawah untuk keluar dari akun Anda.
        </p>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <button 
                onclick="handleLogout()"
                class="group relative inline-flex items-center justify-center w-full px-6 py-3.5 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 active:bg-slate-950 rounded-2xl shadow-lg shadow-slate-900/10 hover:shadow-xl hover:shadow-slate-900/20 active:scale-[0.98] transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">
                <i class="fa-solid fa-right-from-bracket mr-2.5 transition-transform duration-200 group-hover:-translate-x-0.5"></i>
                <span>Logout</span>
            </button>
        </div>

        <div id="logoutToast" class="hidden mt-4 p-3 bg-slate-100 text-slate-600 text-xs rounded-xl transition-all duration-300">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengeluarkan akun Anda...
        </div>

    </main>

    <script>
        function handleLogout() {
            const toast = document.getElementById('logoutToast');
            toast.classList.remove('hidden');
            
            // Simulasi proses logout
            setTimeout(() => {
                toast.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500 mr-2"></i> Berhasil keluar!';
                window.location.href = "https://strever14.github.io/cbt-sekolah/logo.png"
            }, 1000);
        }
    </script>
</body>
</html>
