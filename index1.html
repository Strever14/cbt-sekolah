<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website 1 - Soal</title>

  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- Firebase Monitoring -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-analytics.js";
  import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzo1O4TnJuFm0xlK7flbnSUci547mTBlo",
    authDomain: "cbt-sekolah-7795d.firebaseapp.com",
    databaseURL: "https://cbt-sekolah-7795d-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cbt-sekolah-7795d",
    storageBucket: "cbt-sekolah-7795d.appspot.com",
    messagingSenderId: "734436129747",
    appId: "1:734436129747:web:fc87ab73b2578af5f78d26",
    measurementId: "G-T6KXRTZSMR"
  };

  const app = initializeApp(firebaseConfig);
  try { getAnalytics(app); } catch(e) {}
  const db = getDatabase(app);

  const uid = localStorage.getItem("uid");
  const nama = localStorage.getItem("nama");
  const noPeserta = localStorage.getItem("noPeserta");
  const namaEmail = localStorage.getItem("email");
  const kelas = localStorage.getItem("kelas");
  const ruangan = localStorage.getItem("ruangan");

  set(ref(db, "peserta/" + uid), {
    nama: nama,
    noPeserta: noPeserta,
    email: namaEmail,
    kelas: kelas,
    status: "online",
    waktuMasuk: serverTimestamp(),
    ruangan: ruangan
  });

  onValue(ref(db, "peserta/" + uid + "/status"), (snapshot) => {
    if (snapshot.exists() && snapshot.val() === "keluar") {
      showOutModal();
      remove(ref(db, "peserta/" + uid)).catch(()=>{});
      localStorage.clear();
    }
  });

  window.addEventListener("beforeunload", () => {
    remove(ref(db, "peserta/" + uid)).catch(()=>{});
  });

  function loadBio() {
    document.getElementById("bio").innerHTML = `
      <p><strong>Nomer Peserta : ${noPeserta}</strong></p>
      <p><strong>Nama : ${nama}</strong></p>
      <p><strong>Kelas : ${kelas}</strong></p>
      <input type="hidden" name="no peserta" value="${noPeserta}">
      <input type="hidden" name="nama" value="${nama}">
      <input type="hidden" name="kelas" value="${kelas}">
    `;
  }
  loadBio();
</script>

<link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>📘 Soal Hari Ini</h1>

    <form method="POST" 
      action="https://script.google.com/macros/s/AKfycbwetImozOr2g0f5kL3W7lEAqWOHSBrqvnMw7iA3dyhy7XwSOkEN3MNCjAQrxboBgkkh/exec"
      id="my-form">

      <div id="bio"></div>
      <div id="content"></div>
    </form>

    <!-- Modal Konfirmasi -->
    <div id="confirmationModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-icon">📝</div>
        <div class="modal-title">Konfirmasi Submit</div>
        <div class="modal-message">
          Apakah Anda yakin ingin mengirim jawaban?
        </div>
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-cancel" onclick="hideConfirmationModal()">Batal</button>
          <button class="modal-btn modal-btn-confirm" onclick="submitForm()">Ya, Kirim</button>
        </div>
      </div>
    </div>

    <!-- Modal Berhasil -->
    <div id="successModal" class="modal-overlay">
      <div class="modal-content success-modal">
        <div class="modal-icon">✅</div>
        <div class="modal-title">Berhasil!</div>
        <div class="modal-message">
          Jawaban Anda telah berhasil dikirim.
        </div>
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-ok" onclick="goToLogin()">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal Dikeluarkan -->
    <div id="outModal" class="modal-overlay">
      <div class="modal-content success-modal">
        <div class="modal-icon">❌</div>
        <div class="modal-title">Kamu Dikeluarkan!</div>
        <div class="modal-message">
          Anda dikeluarkan oleh pengawas.
        </div>
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-ok" onclick="goToLogin()">OK</button>
        </div>
      </div>
    </div>

    <div>
      <button type="button" class="modal-btn modal-btn-confirm" onclick="showConfirmationModal()">Kirim</button>
      <button class="modal-btn modal-btn-cancel" onclick="showLogoutModal()">⏻ Logout</button>
    </div>
  </div>

<script>
if (localStorage.getItem("isLoggedIn") !== "true") {
  window.location.href = "login.html";
}

async function loadSoal() {
  try {
    const mapel = localStorage.getItem("mapel");
    const tingkatan = localStorage.getItem("tingkatan");
        
    let resSoal = await fetch(`../cbt-sekolah/soal/${tingkatan}/${mapel}.json`);
    let data = await resSoal.json();

    let html = `<h2>${mapel.replace("_", " ").toUpperCase()}</h2>`;
    html += `<input type="hidden" name="sheetName" value="${mapel.replace("_", " ").toUpperCase()}">`;
        
    html += "<h3>Pilihan Ganda</h3><ol>";
    data.pilihan_ganda.slice(0,40).forEach((q,i) => {
      html += `<li>${q.pertanyaan}`;
      const abjad = ["A","B","C","D","E"];
      q.opsi.forEach((o,j)=>{
        const nilai = (abjad[j]===q.jawaban)?1:0;
        html+=`<label><input type="radio" name="pg${i}" value="${nilai}"> ${abjad[j]}. ${o}</label>`;
      });
      html+="</li>";
    });
    html+="</ol>";

    html+="<h3>Essay</h3><ol>";
    data.essay.slice(0,5).forEach(q=>{
      html+=`<li>${q.pertanyaan}<textarea rows="4"></textarea></li>`;
    });
    html+="</ol>";

    document.getElementById("content").innerHTML=html;

    if(window.MathJax && window.MathJax.typesetPromise){
      window.MathJax.typesetPromise();
    }

  } catch(err){
    document.getElementById("content").innerHTML="<p>Soal tidak bisa dimuat.</p>";
    console.error(err);
  }
}

function showConfirmationModal(){ document.getElementById('confirmationModal').style.display='flex'; }
function hideConfirmationModal(){ document.getElementById('confirmationModal').style.display='none'; }
function showOutModal(){ document.getElementById('outModal').style.display='flex'; }

function goToLogin(){
  localStorage.removeItem("isLoggedIn1");
  window.location.href="login.html";
}

function submitForm(){
  const form=document.getElementById('my-form');
  const data=new FormData(form);

  fetch(form.action,{method:'POST',body:data})
  .then(()=>{
    hideConfirmationModal();
    document.getElementById('successModal').style.display='flex';
    setTimeout(goToLogin,5000);
  })
  .catch(()=>alert("Gagal mengirim jawaban"));
}

function showLogoutModal(){
  if(confirm("Yakin logout? Jawaban tidak akan dikirim otomatis.")){
    window.location.href="login.html";
  }
}

loadSoal();
</script>
</body>
</html>
